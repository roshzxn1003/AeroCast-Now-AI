name: AeroCast-Now AI — CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  AEROCAST_ENV: testing
  DATA_MODE: hybrid
  PYTHONUNBUFFERED: "1"

jobs:
  backend-ci:
    name: Backend Test & Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest flake8

      - name: Syntax & Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Database Migration Verification
        run: |
          cd backend
          PYTHONPATH=. python -m db.migrations status
          PYTHONPATH=. python -m db.migrations migrate
          PYTHONPATH=. python -m db.migrations status

      - name: Run Backend Regression Test Suites (Phases 1-11)
        run: |
          cd backend
          PYTHONPATH=. pytest test_phase11_reliability.py \
                              test_phase10_monitoring.py \
                              test_phase9_ingestion.py \
                              test_nowcasting.py \
                              test_district_nowcast.py \
                              test_alerts.py \
                              test_pipeline.py -v

      - name: ML Inference Smoke Test (CPU Fixture)
        run: |
          python scripts/benchmark_inference.py 5

  frontend-ci:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: TypeScript & Vite Production Bundle
        run: |
          cd frontend
          npm run build

  security-audit:
    name: Security & Configuration Audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify No Production Secrets Committed
        run: |
          echo "Verifying no live production secrets in tracked files..."
          ! git ls-files | grep -E "\.env\.production$"
          ! grep -rn "IMD_API_KEY=[a-zA-Z0-9]" .env.example
          ! grep -rn "BEGIN RSA PRIVATE KEY" .
          ! grep -rn "BEGIN OPENSSH PRIVATE KEY" .

      - name: Verify Configuration Fail-Fast Assertions
        run: |
          cd backend
          PYTHONPATH=. python -c "
          from config.deployment_config import DeploymentConfig, EnvironmentType, ConfigurationError
          import pytest
          
          # Test 1: Production fails fast if insecure admin token
          prod_cfg = DeploymentConfig(
              env=EnvironmentType.PRODUCTION,
              admin_token='test_token',
              secret_key='short',
              db_path='data/aerocast.sqlite3'
          )
          try:
              prod_cfg.validate()
              assert False, 'Should have failed fast on short admin token'
          except ConfigurationError as e:
              assert 'FAIL FAST' in str(e)

          # Test 2: Production fails fast if pointing to dev database
          prod_cfg_dev_db = DeploymentConfig(
              env=EnvironmentType.PRODUCTION,
              admin_token='a_very_long_secure_token_1234567890',
              secret_key='a_very_long_secure_secret_key_1234567890',
              db_path='data/dev/aerocast_dev.sqlite3'
          )
          try:
              prod_cfg_dev_db.validate()
              assert False, 'Should have failed fast on dev database in production'
          except ConfigurationError as e:
              assert 'FAIL FAST' in str(e)
          print('[✓] Configuration Fail-Fast assertions passed!')
          "
